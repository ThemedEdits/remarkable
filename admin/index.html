<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Portal - The Remarkable</title>

  <!-- Prevent indexing -->
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow">

  <!-- Security -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

  <!-- Theme -->
  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark">

  <!-- App Information -->
  <meta name="application-name" content="The Remarkable Admin">
  <meta name="author" content="The Remarkable">
  <meta name="description" content="Administrative dashboard for managing orders, users and site operations.">

  <!-- Referrer Policy -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">

  <meta property="og:title" content="Admin Portal - The Remarkable">
  <meta property="og:description"
    content="Manage orders, users and site operations with the The Remarkable Admin Portal. Secure access for authorized personnel only.">
  <meta property="og:url" content="https://the-remarkable.vercel.app/admin/">
  <meta property="og:image" content="https://the-remarkable.vercel.app/images/admin-portal.jpg">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Main Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages.css">
  <style>
    /* ========== OVERRIDES & GLOBAL (admin only) ========== */
    body {
      background: var(--bg);
    }

    /* modern glassmorphism touches, smooth transitions */
    :root {
      --admin-card-radius: 20px;
      --admin-glow: 0 12px 32px -12px rgba(0, 0, 0, 0.4);
      --admin-transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    /* login screen - modern, glass, animated */
    #login-screen {
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: url('/images/login.jpg') center center / cover no-repeat;
      position: relative;
    }

    .admin-login-card {
      width: 100%;
      max-width: 460px;
      background: rgba(18, 18, 22, 0.25);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(201, 168, 76, 0.25);
      border-radius: 36px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(201, 168, 76, 0.1) inset;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .admin-login-card:hover {
      box-shadow: 0 30px 50px -18px black;
      border-color: rgba(255, 111, 209, 0.4);
    }

    .admin-login-logo {
      font-family: var(--ff-display);
      font-size: 1.9rem;
      font-weight: 500;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      color: var(--text);
    }

    .admin-login-logo span {
      color: var(--gold);
      font-weight: 600;
      background: linear-gradient(135deg, #e4c580, #c9a84c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .admin-login-sub {
      font-size: 0.85rem;
      color: var(--white);
      margin-bottom: 38px;
      letter-spacing: 0.3px;
    }

    .admin-login-form .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-label {
      font-family: var(--ff-mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--white);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }

    .form-input {
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 20px;
      padding: 14px 18px;
      color: var(--text);
      font-size: 0.9rem;
      transition: all 0.2s;
      width: 100%;
    }

    .form-input:focus {
      border-color: var(--gold);
      outline: none;
      box-shadow: 0 0 0 2px rgba(201, 168, 76, 0.2);
      background: rgba(192, 192, 192, 0.6);
    }

    .btn-primary {
      background: linear-gradient(105deg, #c9a84c, #b38f3a);
      border: none;
      border-radius: 40px;
      padding: 14px;
      font-weight: 600;
      letter-spacing: 0.8px;
      transition: transform 0.2s, box-shadow 0.2s;
      color: #0a0a0e;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px -8px rgba(201, 168, 76, 0.4);
      filter: brightness(1.02);
    }

    /* toast modern */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toast {
      background: rgba(20, 20, 26, 0.95);
      backdrop-filter: blur(12px);
      border-left: 3px solid var(--gold);
      border-radius: 18px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 12px 28px -10px black;
      transform: translateX(120%);
      transition: transform 0.3s ease;
    }

    .toast.show {
      transform: translateX(0);
    }

    #recent-orders-container {
      overflow-x: auto;
    }

    /* ========== ADMIN DASHBOARD (completely refreshed) ========== */
    .admin-screen-inner {
      display: flex;
      min-height: 100vh;
      background: url('/images/dashboard.svg') center center / cover no-repeat;
      position: relative;
    }

    /* SIDEBAR - premium dark glass */
    .admin-nav {
      width: 280px;
      flex-shrink: 0;
      background: rgba(12, 12, 16, 0.85);
      backdrop-filter: blur(8px);
      border-right: 1px solid rgba(201, 168, 76, 0.2);
      min-height: 100vh;
      padding: 32px 0;
      position: sticky;
      top: 0;
      z-index: 10;
      transition: all var(--admin-transition);
    }

    .admin-nav-logo {
      font-family: var(--ff-display);
      font-size: 1.5rem;
      font-weight: 500;
      padding: 0 28px 28px;
      border-bottom: 1px solid rgba(201, 168, 76, 0.2);
      margin-bottom: 28px;
      color: var(--text);
    }

    .admin-nav-logo span {
      color: var(--gold);
      background: linear-gradient(145deg, #f3d382, #c9a84c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .admin-nav-logo small {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      display: block;
      margin-top: 6px;
    }

    .admin-nav-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 28px;
      margin: 4px 12px;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .admin-nav-link i {
      width: 24px;
      font-size: 1.1rem;
      transition: transform 0.2s;
    }

    .admin-nav-link:hover {
      background: rgba(201, 168, 76, 0.12);
      color: var(--gold);
      transform: translateX(6px);
    }

    .admin-nav-link:hover i {
      transform: scale(1.05);
    }

    .admin-nav-link.active {
      background: linear-gradient(95deg, rgba(201, 168, 76, 0.18), rgba(201, 168, 76, 0.05));
      color: var(--gold);
      border-left: 3px solid var(--gold);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .admin-nav-link:nth-child(5) {
      border-color: #7d2e2e;
      border: 2px solid rgba(125, 46, 46, 0.3);
    }

    .admin-nav-link:nth-child(5):hover {
      background: rgba(125, 46, 46, 0.12);
      color: #7d2e2e;
      border-color: #7d2e2e;
    }

    /* Main content area */
    .admin-content {
      flex: 1;
      padding: 36px 44px;
      overflow-y: auto;
      transition: all 0.2s;
    }

    /* Stats cards premium */
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      margin-bottom: 48px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--admin-card-radius);

      padding: 24px 20px;

      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);

      transition: all 0.3s ease;

      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -150%;
      width: 80%;
      height: 100%;

      background: linear-gradient(90deg,
          transparent,
          rgba(255, 255, 255, 0.12),
          transparent);

      transform: skewX(-25deg);
      transition: 0.8s;
    }

    .stat-card:hover::before {
      left: 180%;
    }

    .stat-card:hover {
      transform: translateY(-6px);

      background: rgba(255, 255, 255, 0.08);

      border-color: rgba(201, 168, 76, 0.4);

      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.35),
        0 0 25px rgba(201, 168, 76, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .stat-card-icon {
      width: 54px;
      height: 54px;
      border-radius: 28px;
      background: rgba(201, 168, 76, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--gold);
      margin-bottom: 20px;
      transition: all 0.2s;
    }

    .stat-card-num {
      font-family: var(--ff-mono);
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    /* Tables premium */
    .orders-table-wrap {
      background: var(--bg2);
      border-radius: 28px;
      border: 1px solid rgba(201, 168, 76, 0.15);
      overflow: hidden;
      box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.3);
      transition: box-shadow 0.2s;
    }

    .orders-table tbody {
      overflow-x: auto;
    }

    .orders-table {
      width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
    }

    .orders-table th {
      padding: 18px 24px;
      font-family: var(--ff-mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(201, 168, 76, 0.2);
    }

    .orders-table td {
      padding: 18px 24px;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text);
      vertical-align: middle;
    }

    .orders-table tr:last-child td {
      border-bottom: none;
    }

    .orders-table tr:hover td {
      background: rgba(201, 168, 76, 0.03);
    }

    /* Status badges with glass */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      backdrop-filter: blur(4px);
    }

    .status-pending {
      background: rgba(201, 168, 76, 0.18);
      color: #e6c97e;
      border: 0.5px solid rgba(201, 168, 76, 0.4);
    }

    .status-confirmed {
      background: rgba(76, 175, 118, 0.16);
      color: #7ad0a0;
      border: 0.5px solid #2e7d5e40;
    }

    .order-actions {
      display: flex;
      gap: 10px;
    }

    .order-action-btn {
      padding: 8px 14px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.4);
      border: 0.5px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s;
      cursor: pointer;
    }

    .btn-confirm {
      color: #7ad0a0;
      border-color: #7ad0a040;
    }

    .btn-confirm:hover {
      background: #2e7d5e;
      color: white;
      border-color: #2e7d5e;
    }

    .btn-deliver {
      color: #7b9ef0;
    }

    .btn-deliver:hover {
      background: #4a6fbf;
      color: white;
    }

    .btn-reject {
      color: #e07a7a;
    }

    .btn-reject:hover {
      background: #b14b4b;
      color: white;
    }

    /* modal premium */
    .order-detail-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }

    .order-detail-modal.open {
      opacity: 1;
      visibility: visible;
    }

    .order-detail-card {
      background: var(--bg2);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 36px;
      padding: 32px;
      width: 100%;
      max-width: 620px;
      max-height: 85vh;
      overflow-y: auto;
      transform: scale(0.96);
      transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      box-shadow: var(--admin-glow);
    }

    .order-detail-modal.open .order-detail-card {
      transform: scale(1);
    }

    #status-filter {
      text-align: center;
    }

    /* filter + search */
    .custom-select,
    #order-search {
      background: var(--bg2);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 40px;
      padding: 10px 20px;
      color: var(--text);
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .custom-select:focus,
    #order-search:focus {
      border-color: var(--gold);
      outline: none;
    }

    /* responsiveness (modern full) */
    @media (max-width: 1100px) {
      .admin-content {
        padding: 24px;
      }

      .admin-stats {
        gap: 18px;
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 900px) {
      .admin-nav {
        width: 200px;
        padding: 20px 0;
      }

      .admin-nav-logo {
        font-size: 1.2rem;
        text-align: left;
        padding: 0 20px 20px;
      }

      .admin-nav-logo small {
        display: none;
      }


      .admin-nav-link {
        justify-content: flex-start;
        padding: 12px 20px;
        margin: 4px 10px;
      }

      .admin-nav-link span {
        display: inline !important;
      }

      .admin-nav-link i {
        margin-right: 6px;
      }

      .admin-nav-link.active {
        border-left: none;
        border-right: 2px solid var(--gold);
      }

      .admin-stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {


      .admin-content {
        padding: 20px 18px;
        margin-top: 5rem;
      }

      .stat-card {
        padding: 18px;
      }

      .stat-card-num {
        font-size: 1.6rem;
      }

      .orders-table th,
      .orders-table td {
        padding: 14px 16px;
      }



      .admin-login-card {
        padding: 36px 28px;
        margin: 16px;
      }
    }

    @media (max-width: 580px) {

      .admin-screen-inner {
        flex-direction: column;
      }

      .admin-ref {
        display: flex;
        align-items: center;
      }

      .admin-nav {
        width: 100%;
        min-height: auto;
        position: fixed;
        top: 0;
        z-index: 100;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        padding: 12px;
        border-right: none;
        border-bottom: 1px solid rgba(201, 168, 76, .2);
      }

      .admin-nav-logo {
        display: none;
      }

      .admin-nav-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px 14px;
        margin: 0;
        border-radius: 12px;
      }

      .admin-nav-link span {
        display: inline !important;
        font-size: .75rem;
      }

      .admin-nav-link i {
        font-size: 0.9rem;
      }

      .admin-stats {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .admin-content {
        padding: 18px;
      }

      .orders-table th,
      .orders-table td {
        font-size: 0.75rem;
        padding: 12px 12px;
      }

      .order-detail-card {
        padding: 20px;
      }
    }

    @media (max-width: 480px) {
      .admin-stats {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .stat-card {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 16px;
      }

      .stat-card-icon {
        margin-bottom: 0;
      }

      .stat-card-num {
        font-size: 1.4rem;
      }

      .orders-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }

      .admin-nav {
        justify-content: flex-start;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding: 10px;
      }

      .admin-nav-link {
        flex-shrink: 0;
      }

      .admin-nav-link span {
        display: inline !important;
        font-size: .72rem;
      }


      .order-actions {
        flex-wrap: nowrap;
      }

      .order-action-btn {
        min-width: 80px;
        padding: 10px;
        font-size: .65rem;
      }
    }

    /* nice header animation */
    .admin-header {
      margin-bottom: 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .admin-title {
      font-family: var(--ff-display);
      font-size: 1.9rem;
      font-weight: 400;
      background: linear-gradient(135deg, #ffffff, #dddddd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.2px;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--gold);
      border-radius: 30px;
      padding: 8px 18px;
      color: var(--gold);
      transition: 0.2s;
    }

    .btn-outline:hover {
      background: rgba(201, 168, 76, 0.15);
      transform: translateY(-1px);
    }

    /* Smooth fade sections */
    [id^="section-"] {
      animation: fadeSlideUp 0.3s ease-out;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div id="toast-container"></div>

  <!-- LOGIN SCREEN (restyled but identical functionality) -->
  <div id="login-screen">
    <div class="admin-login-card">
      <div
        style="width:64px;height:64px; display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:1.6rem;color:var(--gold);">
        <img src="/images/logo.png" alt="The Remarkable" class="loader-logo-img">
      </div>
      <div class="admin-login-logo">The <span>Remarkable</span></div>
      <div class="admin-login-sub">Admin Portal — Restricted Access</div>
      <div class="admin-login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" id="login-email" placeholder="admin@theremarkable.pk" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div style="position:relative;">
            <input type="password" class="form-input" id="login-password" placeholder="••••••••" required
              style="padding-right:44px;">
            <button type="button" onclick="togglePw()"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-dim);background:none;border:none;cursor:pointer;">
              <i class="fa-regular fa-eye" id="pw-eye"></i>
            </button>
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:16px;" onclick="handleLogin()">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
        <div id="login-error" style="display:none;color:var(--red);font-size:0.8rem;text-align:center;margin-top:12px;">
        </div>
      </div>
      <div style="margin-top:28px;"><a href="/" style="font-size:0.8rem;color:var(--text-dim);"><i
            class="fa-solid fa-arrow-left"></i> Back to Store</a></div>
    </div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="admin-screen">
    <div class="admin-screen-inner">

      <nav class="admin-nav">
        <div class="admin-nav-logo">The <span>Remarkable</span><br><small>ADMIN PANEL</small></div>
        <div class="admin-nav-link active" data-section="dashboard" onclick="showSection('dashboard')"><i
            class="fa-solid fa-chart-pie"></i><span>Dashboard</span></div>
        <div class="admin-nav-link" data-section="orders" onclick="showSection('orders')"><i
            class="fa-solid fa-box"></i><span>Orders</span></div>
        <div class="admin-nav-link" data-section="pending" onclick="showSection('pending')"><i
            class="fa-solid fa-clock"></i><span>Pending</span></div>
        <div class="admin-nav-link" style="margin-top:auto;" onclick="handleLogout()"><i
            class="fa-solid fa-right-from-bracket"></i><span>Sign Out</span></div>
      </nav>
      <main class="admin-content">
        <!-- Dashboard -->
        <div id="section-dashboard">
          <div class="admin-header">
            <h1 class="admin-title">Dashboard</h1>
            <div class="admin-ref"><span style="font-size:0.8rem;color:var(--text-muted);"><i
                  class="fa-solid fa-user-shield" style="color:var(--gold);"></i> <span
                  id="admin-email-display"></span></span><button class="btn btn-outline btn-sm"
                style="margin-left:12px;" onclick="loadAllOrders()"><i class="fa-solid fa-rotate"></i> Refresh</button>
            </div>
          </div>
          <div class="admin-stats" id="stats-grid">
            <div class="stat-card">
              <div class="stat-card-icon"><i class="fa-solid fa-box"></i></div>
              <div class="stat-card-num" id="stat-total">—</div>
              <div>Total Orders</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-icon"><i class="fa-solid fa-clock"></i></div>
              <div class="stat-card-num" id="stat-pending">—</div>
              <div>Pending</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-icon"><i class="fa-solid fa-circle-check"></i></div>
              <div class="stat-card-num" id="stat-confirmed">—</div>
              <div>Confirmed</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-icon"><i class="fa-solid fa-truck-fast"></i></div>
              <div class="stat-card-num" id="stat-revenue">—</div>
              <div>Revenue</div>
            </div>
          </div>
          <div class="orders-table-wrap">
            <div class="orders-table-head" style="padding:20px 24px;">
              <h3 class="orders-table-title">Recent Orders</h3><a href="#" onclick="showSection('orders')"
                style="color:var(--gold);">View All <i class="fa-solid fa-arrow-right"></i></a>
            </div>
            <div id="recent-orders-container">
              <div style="padding:40px;text-align:center;"><i class="fa-solid fa-spinner fa-spin"
                  style="color:var(--gold);"></i></div>
            </div>
          </div>
        </div>
        <!-- Orders -->
        <div id="section-orders" style="display:none;">
          <div class="admin-header">
            <h1 class="admin-title">All Orders</h1>
            <div style="display:flex;gap:12px;"><input type="text" id="order-search" placeholder="Search orders..."
                class="form-input" style="text-align:center;" oninput="filterOrders()"><select id="status-filter"
                class="custom-select" onchange="filterOrders()">
                <option value="">All Status</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="delivered">Delivered</option>
                <option value="rejected">Rejected</option>
              </select><button class="btn btn-outline btn-sm" onclick="loadAllOrders()"><i
                  class="fa-solid fa-rotate"></i></button></div>
          </div>
          <div class="orders-table-wrap">
            <div id="all-orders-container">
              <div style="padding:40px;text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i></div>
            </div>
          </div>
        </div>
        <!-- Pending -->
        <div id="section-pending" style="display:none;">
          <div class="admin-header">
            <h1 class="admin-title">Pending Orders</h1><button class="btn btn-outline btn-sm"
              onclick="loadAllOrders()"><i class="fa-solid fa-rotate"></i> Refresh</button>
          </div>
          <div class="orders-table-wrap">
            <div id="pending-orders-container">
              <div style="padding:40px;text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- ORDER MODAL -->
  <div class="order-detail-modal" id="order-modal">
    <div class="order-detail-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:24px;">
        <h3 style="font-family:var(--ff-display);">Order Details</h3><button onclick="closeModal()"
          style="background:none;border:none;color:var(--text-muted);font-size:1.2rem;"><i
            class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="modal-content"></div>
    </div>
  </div>

  <script type="module">
    import { auth, db, getOrders, updateOrderStatus, signInWithEmailAndPassword, signOut, onAuthStateChanged } from '../js/firebase.js';
    let allOrders = [];
    onAuthStateChanged(auth, user => { if (user) { document.getElementById('login-screen').style.display = 'none'; document.getElementById('admin-screen').style.display = 'block'; document.getElementById('admin-email-display').textContent = user.email; loadAllOrders(); } else { document.getElementById('login-screen').style.display = 'flex'; document.getElementById('admin-screen').style.display = 'none'; } });
    window.handleLogin = async () => { const email = document.getElementById('login-email').value.trim(), pwd = document.getElementById('login-password').value, errEl = document.getElementById('login-error'); errEl.style.display = 'none'; if (!email || !pwd) { errEl.style.display = 'block'; errEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Required fields'; return; } const btn = document.querySelector('#login-screen .btn-primary'); btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing...'; try { await signInWithEmailAndPassword(auth, email, pwd); } catch (e) { errEl.style.display = 'block'; errEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Invalid credentials'; btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In'; } };
    window.handleLogout = async () => { if (confirm('Sign out?')) await signOut(auth); };
    window.togglePw = () => { const i = document.getElementById('login-password'); const eye = document.getElementById('pw-eye'); if (i.type === 'password') { i.type = 'text'; eye.className = 'fa-regular fa-eye-slash'; } else { i.type = 'password'; eye.className = 'fa-regular fa-eye'; } };
    window.loadAllOrders = async () => { allOrders = await getOrders(); document.getElementById('stat-total').textContent = allOrders.length; document.getElementById('stat-pending').textContent = allOrders.filter(o => o.status === 'pending').length; document.getElementById('stat-confirmed').textContent = allOrders.filter(o => o.status === 'confirmed').length; const revenue = allOrders.filter(o => o.status !== 'rejected').reduce((s, o) => s + (o.total || 0), 0); document.getElementById('stat-revenue').textContent = `PKR ${revenue.toLocaleString()}`; renderOrdersTable(allOrders.slice(0, 8), 'recent-orders-container'); renderOrdersTable(allOrders, 'all-orders-container'); renderOrdersTable(allOrders.filter(o => o.status === 'pending'), 'pending-orders-container'); };
    function renderOrdersTable(orders, containerId) { const c = document.getElementById(containerId); if (!orders.length) { c.innerHTML = `<div style="padding:48px;text-align:center;color:var(--text-muted);"><i class="fa-solid fa-inbox" style="font-size:2rem;"></i><p>No orders</p></div>`; return; } c.innerHTML = `<table class="orders-table"><thead><tr><th>Order ID</th><th>Customer</th><th>City</th><th>Items</th><th>Total</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead><tbody>${orders.map(o => { const shortId = `TR-${o.id.slice(-8).toUpperCase()}`; const date = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleDateString('en-PK') : 'Just now'; const statusMap = { pending: 'status-pending', confirmed: 'status-confirmed', delivered: 'status-delivered', rejected: 'status-rejected' }; const iconMap = { pending: 'fa-clock', confirmed: 'fa-check', delivered: 'fa-truck', rejected: 'fa-xmark' }; return `<tr><td><span style="font-family:monospace;cursor:pointer;color:var(--gold);" onclick="viewOrderDetail('${o.id}')">${shortId}</span></td><td>${o.customer?.name || '—'}<div style="font-size:0.7rem;">${o.customer?.phone || ''}</div></td><td>${o.customer?.city || '—'}</td><td>${o.items?.length || 0}</td><td>PKR ${(o.total || 0).toLocaleString()}</td><td>${date}</td><td><span class="status-badge ${statusMap[o.status]}"><i class="fa-solid ${iconMap[o.status]}"></i> ${o.status?.charAt(0).toUpperCase() + o.status?.slice(1) || 'Pending'}</span></td><td><div class="order-actions"><button class="order-action-btn btn-confirm" onclick="updateStatus('${o.id}','confirmed')" ${o.status === 'confirmed' || o.status === 'delivered' ? 'disabled' : ''}><i class="fa-solid fa-check"></i></button><button class="order-action-btn btn-deliver" onclick="updateStatus('${o.id}','delivered')" ${o.status === 'delivered' ? 'disabled' : ''}><i class="fa-solid fa-truck"></i></button><button class="order-action-btn btn-reject" onclick="updateStatus('${o.id}','rejected')" ${o.status === 'rejected' ? 'disabled' : ''}><i class="fa-solid fa-xmark"></i></button><button class="order-action-btn" style="border-color:var(--white); color:var(--white);" onclick="viewOrderDetail('${o.id}')"><i class="fa-solid fa-eye"></i></button></div></td></tr>` }).join('')}</tbody></table>`; }
    window.updateStatus = async (id, status) => { if (!confirm(`Mark as ${status}?`)) return; try { await updateOrderStatus(id, status); showToast(`Order ${status}`, '', 'success', 'fa-check-circle'); loadAllOrders(); } catch (e) { showToast('Update failed', 'try again', 'error', 'fa-circle-xmark'); } };
    window.viewOrderDetail = (id) => { const order = allOrders.find(o => o.id === id); if (!order) return; const shortId = `TR-${order.id.slice(-8).toUpperCase()}`; const date = order.createdAt?.toDate ? order.createdAt.toDate().toLocaleString() : 'Just now'; document.getElementById('modal-content').innerHTML = `<div style="display:grid;gap:16px;"><div><div style="color:var(--gold);">ORDER ID</div><div>${shortId}</div></div><div><div style="color:var(--gold);">DATE</div><div>${date}</div></div><div><div style="color:var(--gold);">CUSTOMER</div><div>${order.customer?.name}</div></div><div><div style="color:var(--gold);">PHONE</div><div>${order.customer?.phone}</div></div><div><div style="color:var(--gold);">ADDRESS</div><div>${order.customer?.address}, ${order.customer?.city}</div></div>${order.customer?.notes ? `<div><div>NOTES</div><div>${order.customer.notes}</div></div>` : ''}</div><div style="border-top:1px solid var(--border);margin-top:12px;"><h4>Items</h4>${(order.items || []).map(it => `<div style="display:flex;justify-content:space-between;"><span>${it.name} x ${it.qty}</span><span>PKR ${(it.price * it.qty).toLocaleString()}</span></div>`).join('')}<div style="font-weight:bold;margin-top:12px;">Total: PKR ${order.total.toLocaleString()}</div></div><div style="display:flex;gap:10px;margin-top:20px;flex-direction:column;">${order.status !== 'confirmed' && order.status !== 'delivered' ? `<button class="order-action-btn btn-confirm" onclick="updateStatus('${order.id}','confirmed');closeModal()">Confirm</button>` : ''}${order.status !== 'delivered' ? `<button class="order-action-btn btn-deliver" onclick="updateStatus('${order.id}','delivered');closeModal()">Deliver</button>` : ''}${order.status !== 'rejected' ? `<button class="order-action-btn btn-reject" onclick="updateStatus('${order.id}','rejected');closeModal()">Reject</button>` : ''}<a href="https://wa.me/${order.customer?.phone?.replace(/\D/g, '')}" target="_blank" class="order-action-btn" style="color:#25D366;text-align:center;">WhatsApp</a></div>`; document.getElementById('order-modal').classList.add('open'); };
    window.closeModal = () => document.getElementById('order-modal').classList.remove('open');
    window.showSection = (name) => { document.querySelectorAll('[id^="section-"]').forEach(s => s.style.display = 'none'); document.getElementById(`section-${name}`).style.display = 'block'; document.querySelectorAll('.admin-nav-link').forEach(l => l.classList.remove('active')); document.querySelector(`.admin-nav-link[data-section="${name}"]`)?.classList.add('active'); };
    window.filterOrders = () => { const search = document.getElementById('order-search')?.value.toLowerCase() || ''; const status = document.getElementById('status-filter')?.value || ''; let filtered = allOrders; if (status) filtered = filtered.filter(o => o.status === status); if (search) filtered = filtered.filter(o => o.customer?.name?.toLowerCase().includes(search) || o.customer?.phone?.includes(search) || o.id.slice(-8).toLowerCase().includes(search) || o.customer?.city?.toLowerCase().includes(search)); renderOrdersTable(filtered, 'all-orders-container'); };
    function showToast(title, sub, type, icon) { const cont = document.getElementById('toast-container'); const toast = document.createElement('div'); toast.className = `toast toast-${type}`; toast.innerHTML = `<i class="fa-solid ${icon}"></i><div><strong>${title}</strong>${sub ? `<br><small>${sub}</small>` : ''}</div>`; cont.appendChild(toast); setTimeout(() => toast.classList.add('show'), 10); setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3200); } window.showToast = showToast;
    document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') window.handleLogin(); });
    document.getElementById('order-modal')?.addEventListener('click', e => { if (e.target === document.getElementById('order-modal')) closeModal(); });
  </script>
</body>

</html>
